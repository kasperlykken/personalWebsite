<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>404 – Siden blev ikke fundet</title>

    <style>
        html {
            visibility: hidden;
        }
    </style>

    <script>
        if (location.pathname.startsWith("/DnD/Website/")) {
            location.replace("/DnD/Website/404.html");
        } else {
            document.documentElement.style.visibility = "visible";
        }
    </script>
</head>

<body>
    <h1>404</h1>
    <p>Siden blev ikke fundet.</p>
    <a href="/">Til forsiden</a>
</body>
</html>
